name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Cordova
        run: npm install -g cordova

      - name: Adicionar plataforma Android
        run: cordova platform add android

      - name: Compilar APK (debug)
        run: cordova build android

      - name: Conferir permissões no manifest final
        run: cat platforms/android/app/src/main/AndroidManifest.xml

      - name: Conferir plugins instalados
        run: cordova plugin list

      - name: Localizar APK gerado
        run: find . -name "*.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gestor-validade-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
